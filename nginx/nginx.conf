# =========================================================================
# IoT Honeynet — Nginx Virtual Layer
#
# Architecture:
#   Internet → Nginx (:80) → Gateway (:8080) → IoT/Honeypot/Dummy pools
#
# Security properties:
#   - Nginx is the ONLY container with a host-bound port (:80)
#   - All device + gateway ports are internal only (no host binding)
#   - Fingerprinting headers stripped — attacker sees no server info
#   - Rate limiting on all endpoints — slows down scanners
#   - Direct device port access is impossible from outside
# =========================================================================

# Rate limiting zone — 20 req/s per IP, burst of 50
limit_req_zone $binary_remote_addr zone=honeynet:10m rate=20r/s;

server {
    listen 80;
    server_name _;                   # accept any hostname / bare IP

    # ── Fingerprint suppression ──────────────────────────────────────────
    server_tokens off;               # hide Nginx version
    more_clear_headers Server;       # requires ngx_headers_more; falls back gracefully
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         DENY;
    add_header Referrer-Policy         no-referrer;

    # ── Rate limiting ────────────────────────────────────────────────────
    limit_req zone=honeynet burst=50 nodelay;
    limit_req_status 429;

    # ── Proxy all traffic → Gateway ──────────────────────────────────────
    # The gateway classifies every request (benign → real IoT pool,
    # suspicious → honeypot pool). Nginx just passes it through cleanly.
    location / {
        proxy_pass         http://gateway:8080;

        # Pass real client IP so gateway logs the attacker's actual address
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Strip any internal headers the attacker might try to inject
        proxy_set_header   X-Gateway-ReqId   "";
        proxy_set_header   X-Gateway-Label   "";
        proxy_set_header   X-Gateway-FlowMeta "";

        # Timeouts — generous enough for LLM analysis (up to 4 min)
        proxy_connect_timeout  10s;
        proxy_read_timeout     240s;
        proxy_send_timeout     30s;

        # Don't buffer — stream responses back immediately
        proxy_buffering    off;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Health check endpoint (internal use only) ────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
